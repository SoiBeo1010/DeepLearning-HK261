[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplearning-hk261"
version = "0.1.0"
description = "FER2013 facial emotion recognition using CCT and ResNet18"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10.4,<13",
]

[project.scripts]
fer = "fer.app:main"
fer-train = "fer.training:main"

[project.optional-dependencies]
train = ["scikit-learn>=1.5,<2", "tqdm>=4.66,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
